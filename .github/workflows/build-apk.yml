name: Build IslamDetector APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Extract Android project
        shell: bash
        run: |
          unzip -o IslamDetector-v0.1-project.zip
          echo "Project extracted"
          ls -la IslamDetector-v0.1

      - name: Build Android APK
        shell: bash
        run: |
          cd IslamDetector-v0.1

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          echo "Building IslamDetector v0.1"
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          APK_PATH="$(find IslamDetector-v0.1 -type f -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: app-debug.apk was not produced."
            find IslamDetector-v0.1 -type f -name '*.apk' -print
            exit 1
          fi

          cp "$APK_PATH" IslamDetector-v0.1-debug.apk
          ls -lh IslamDetector-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamDetector-v0.1-debug
          path: IslamDetector-v0.1-debug.apk
          if-no-files-found: error

