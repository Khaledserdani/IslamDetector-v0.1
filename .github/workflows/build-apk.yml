name: Build IslamDetector APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -o IslamDetector-v0.1-project.zip
          echo "Project extracted"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Locate and build Android project
        shell: bash
        run: |
          PROJECT_DIR="$(find . -type f -name gradlew -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew was not found after extracting the ZIP file."
            exit 1
          fi

          echo "Android project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          APK_PATH="$(find . -type f -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: app-debug.apk was not produced."
            find . -type f -name '*.apk'
            exit 1
          fi

          cp "$APK_PATH" IslamDetector-v0.1-debug.apk
          ls -lh IslamDetector-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamDetector-v0.1-debug
          path: IslamDetector-v0.1-debug.apk
          if-no-files-found: error
